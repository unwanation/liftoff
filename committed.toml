# Conventional Commits enforcement (https://github.com/crate-ci/committed).
style = "conventional"
subject_length = 72
line_length = 100
subject_capitalized = false
subject_not_punctuated = true
imperative_subject = true
no_fixup = true
no_wip = true
allowed_types = [
  "feat",
  "fix",
  "docs",
  "style",
  "refactor",
  "perf",
  "test",
  "build",
  "ci",
  "chore",
  "revert",
  "security",
]
merge_commit = false
