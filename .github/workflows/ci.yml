name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: true
      - run: cargo fmt --all -- --check
      - run: cargo fmt --all --manifest-path modules/Cargo.toml -- --check
      - run: taplo fmt --check
      - run: typos
      - run: scripts/wit-deps.sh --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --manifest-path modules/Cargo.toml --workspace --all-targets --target wasm32-wasip2 --locked -- -D warnings
      - run: cargo machete --with-metadata
      - run: cargo doc --workspace --all-features --no-deps --locked
      - run: cargo doc --manifest-path modules/Cargo.toml --workspace --target wasm32-wasip2 --no-deps --locked

  features:
    name: feature powerset
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: true
      - run: cargo hack check --workspace --feature-powerset --no-dev-deps

  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: true
      # The host tests (crates/wasm, crates/liftoffd) load the components
      # this builds (modules/target/wasm32-wasip2/release, the default of
      # WASM_MODULES_DIR).
      - run: cargo build --manifest-path modules/Cargo.toml --workspace --target wasm32-wasip2 --release --locked
      # The contract functions in TS and Python (crates/wasm/tests/contract_functions.rs),
      # with the bun and uv of mise.toml.
      - run: just functions
      - run: cargo nextest run --workspace --all-features --locked --profile ci
      - run: cargo test --workspace --all-features --locked --doc
      # What modules.yml does on a tag, for every module, with a throwaway key.
      - run: modules/registry/check.sh
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: true
      # The host tests (crates/wasm, crates/liftoffd) load the components of modules/.
      - run: cargo build --manifest-path modules/Cargo.toml --workspace --target wasm32-wasip2 --release --locked
      # The contract functions in TS and Python (crates/wasm/tests/contract_functions.rs),
      # with the bun and uv of mise.toml.
      - run: just functions
      - run: cargo llvm-cov nextest --workspace --all-features --locked --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check
          arguments: --workspace --all-features
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check
          manifest-path: modules/Cargo.toml
          arguments: --workspace --all-features --config deny.toml

  infra:
    name: workflows, scripts, Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans history
      # Before mise: its cargo tools would each install the toolchain of
      # rust-toolchain.toml at once and collide.
      - run: rustup toolchain install # from rust-toolchain.toml
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: true
      - run: actionlint
      - run: zizmor --persona=pedantic .github/workflows
      - run: shellcheck --severity=warning scripts/*.sh modules/registry/*.sh
      - run: hadolint Dockerfile
      - run: gitleaks git --redact --no-banner

  docker:
    name: container build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: liftoff:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm liftoff:ci --version
