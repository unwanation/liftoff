name: Release

on:
  push:
    # `*` stops at `/`: the module tags `modules/<crate>/vX.Y.Z` are
    # modules.yml's, not this workflow's.
    tags: ["v*.*.*"]

permissions: {}

# One release at a time per tag; never cancel a publish half-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  binary:
    name: binary (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # musl-gcc: aws-lc-sys (reqwest's TLS) compiles C for the musl target.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: rustup toolchain install && rustup target add "${TARGET}"
        env:
          TARGET: ${{ matrix.target }}
      # No tool cache on release builds: published artefacts must not depend
      # on cache contents (zizmor: cache-poisoning).
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-cyclonedx
      # `cargo auditable` embeds the dependency list in the binary so
      # `cargo audit bin` can scan deployed artifacts later.
      - run: cargo auditable build --release --locked --workspace --bins --target "${TARGET}"
        env:
          TARGET: ${{ matrix.target }}
      - run: cargo cyclonedx --format json --all --override-filename "liftoff-${TARGET}.cdx"
        env:
          TARGET: ${{ matrix.target }}
      # The sums are signed with the release key: install.sh
      # refuses a release without `SHA256SUMS-<target>.txt.sig`, so a
      # missing secret fails the release instead of publishing it unsigned.
      - name: package
        run: |
          set -euo pipefail
          : "${SIGNING_KEY:?secret LIFTOFF_SIGNING_KEY is not set: install.sh refuses an unsigned release}"
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          LIFTOFF_SIGNING_KEY="$key" scripts/package-release.sh "${TARGET}" dist
        env:
          TARGET: ${{ matrix.target }}
          SIGNING_KEY: ${{ secrets.LIFTOFF_SIGNING_KEY }}
      - name: publish release assets
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  container:
    name: container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
