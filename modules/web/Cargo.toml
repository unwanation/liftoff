[package]
name = "liftoff-module-web"
description = "The web module of liftoff: the origin of the panel liftoff-web, its CORS and the pages it takes over."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The oldest liftoffd the module runs on: `liftoffd_min` of its release in
# the registry's index.json (modules/registry/release.sh, REG-02). The
# hook `web_panel` is liftoffd 2.0.0's.
[package.metadata.liftoff]
liftoffd_min = "2.0.0"

[lib]
# `web.wasm` in `modules/target/wasm32-wasip2/release/`.
name = "web"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
wit-bindgen = { workspace = true }
