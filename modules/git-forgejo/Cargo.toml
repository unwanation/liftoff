[package]
name = "liftoff-module-git-forgejo"
description = "The git.forgejo module of liftoff: the core's Git port over the Forgejo API as the user's own connection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The oldest liftoffd the module runs on: `liftoffd_min` of its release in
# the registry's index.json (modules/registry/release.sh, REG-02).
[package.metadata.liftoff]
liftoffd_min = "2.0.0-alpha.2"

[lib]
# `git_forgejo.wasm` in `modules/target/wasm32-wasip2/release/`.
name = "git_forgejo"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
serde_json = { workspace = true }
wit-bindgen = { workspace = true }
