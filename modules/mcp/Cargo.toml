[package]
name = "liftoff-module-mcp"
description = "The mcp module of liftoff: MCP over Streamable HTTP at /mcp, an OAuth resource server through the oidc module."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The oldest liftoffd the module runs on: `liftoffd_min` of its release in
# the registry's index.json (modules/registry/release.sh, REG-02). The
# hooks `mcp_resource` and `verify_token` and `/mcp` are liftoffd 2.0.0's.
[package.metadata.liftoff]
liftoffd_min = "2.0.0"

[lib]
# `mcp.wasm` in `modules/target/wasm32-wasip2/release/`.
name = "mcp"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
wit-bindgen = { workspace = true }
