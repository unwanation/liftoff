[package]
name = "liftoff-module-oidc"
description = "The oidc module of liftoff: device flow and browser login against an OpenID Connect provider, roles from a claim."
# 0.2.0: the data hook `verify_token`, after the
# released 0.1.0; the registry never replaces a version.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The oldest liftoffd the module runs on: `liftoffd_min` of its release in
# the registry's index.json (modules/registry/release.sh, REG-02). The
# hook `verify_token` of its manifest is liftoffd 2.0.0's: an older daemon cannot read the manifest.
[package.metadata.liftoff]
liftoffd_min = "2.0.0"

[lib]
# `oidc.wasm` in `modules/target/wasm32-wasip2/release/`.
name = "oidc"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
getrandom = { workspace = true }
num-bigint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
wit-bindgen = { workspace = true }
