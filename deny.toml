# cargo-deny: supply-chain policy. Run with `cargo deny check` (or `just deny`).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "aarch64-apple-darwin",
]
all-features = true

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
  # { id = "RUSTSEC-0000-0000", reason = "why this does not affect us, and the tracking issue" },
]

[licenses]
version = 2
# Permissive licenses only. Add to this list consciously; copyleft is rejected.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "0BSD",
  "CC0-1.0",
  # MIT without the attribution clause (borrow-or-share, under jsonschema's
  # `referencing`): more permissive than MIT, OSI approved.
  "MIT-0",
]
confidence-threshold = 0.9
# The allow-list is a policy, not an inventory; entries need not be in use yet.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version on purpose.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
  # TLS: rustls only. OpenSSL drags in a C toolchain and a second CVE stream.
  { crate = "openssl", reason = "use rustls" },
  { crate = "openssl-sys", reason = "use rustls" },
  { crate = "native-tls", reason = "use rustls" },
  # Unmaintained or superseded.
  { crate = "async-std", reason = "tokio is the runtime" },
  { crate = "failure", reason = "unmaintained; use thiserror" },
  { crate = "term", reason = "unmaintained" },
  { crate = "serde_yaml", reason = "deprecated by its author; config is TOML" },
  { crate = "rustc-serialize", reason = "unmaintained; use serde" },
  { crate = "time:<0.3", reason = "RUSTSEC-2020-0071" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
