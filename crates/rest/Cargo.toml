[package]
name = "liftoff-rest"
description = "REST (HTTP/JSON) interface adapter built on axum."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
# Referenced as a string in `#[serde(with = "humantime_serde")]`.
ignored = ["humantime-serde"]

[dependencies]
axum = { workspace = true, features = [
  "http1",
  "http2",
  "json",
  "tokio",
  "matched-path",
  "multipart",
  "original-uri",
  "query",
  "tracing",
] }
base64 = { workspace = true, features = ["alloc"] }
futures-util = { workspace = true, features = ["std"] }
http = { workspace = true }
# `GET /api/v1/tunnel` takes the connection over after its `101`: hyper's upgrade under axum, as a tokio stream.
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
humantime-serde = { workspace = true }
liftoff-api = { workspace = true }
liftoff-core = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sha1 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "std"] }
tokio = { workspace = true, features = ["net", "rt"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = [
  "catch-panic",
  "limit",
  "request-id",
  "sensitive-headers",
  "set-header",
  "timeout",
  "trace",
  "util",
] }
tracing = { workspace = true, features = ["std", "attributes"] }
utoipa = { workspace = true, features = ["macros"] }

[dev-dependencies]
http-body-util = { workspace = true }
liftoff-core = { workspace = true, features = ["test-support"] }
rstest = { workspace = true }
# The hash of the pages' stylesheet in their CSP.
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync"] }
# Captures the request spans: the token of a one-time link stays out of
# the log.
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
