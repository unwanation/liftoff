[package]
name = "liftoff-proxy"
description = "Caddy admin API adapter of liftoff: the whole proxy config, pushed at once."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
liftoff-core = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio", "query"] }
insta = { workspace = true }
liftoff-core = { workspace = true, features = ["test-support"] }
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true, features = ["derive"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "net", "time"] }
