[package]
name = "liftoff-host"
description = "Server-host adapters of liftoff: docker compose, systemctl, project files and public DNS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
liftoff-core = { workspace = true }

futures-core = { workspace = true }
# `DnsResolver`: CNAME and A lookups of external domains at public name
# servers.
hickory-resolver = { workspace = true, features = ["tokio"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "sync"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
liftoff-core = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
