[package]
name = "liftoff-mcp"
description = "MCP interface adapter: the tools and resources of the liftoff API over stdio and Streamable HTTP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { workspace = true, features = ["alloc"] }
# The Streamable HTTP transport of `/mcp`: a
# tower service over `http` requests, answering `rmcp`'s body type.
bytes = { workspace = true }
futures-core = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
liftoff-api = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "json", "query"] }
rmcp = { workspace = true, features = [
  "server",
  "transport-io",
  "transport-streamable-http-server",
] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "io-std", "rt", "time", "macros"] }
# The shutdown of `/mcp`'s event streams: `rmcp`'s own cancellation type.
tokio-util = { workspace = true }
tower = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio", "query"] }
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time", "test-util"] }
# tests/mcp/http.rs drives the HTTP transport in memory.
tower = { workspace = true, features = ["util"] }
