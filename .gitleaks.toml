# gitleaks (lefthook pre-commit, CI): the default rules, plus one false
# positive of Cargo lockfiles. In a `dependencies` list the crate name
# `crypto_secretbox` followed by the next entry matches the rule
# `generic-api-key` (the next crate's name taken for the key). Only a
# match of that shape is exempt, two quoted crate names on consecutive
# entries: the rest of a lockfile (a `source` URL that embeds a token,
# say) is scanned like any other file. The allowlist names no `paths`:
# gitleaks 8.30 skips every finding of a file its `paths` match, even
# with `condition = "AND"`.
[extend]
useDefault = true

[[allowlists]]
description = "Two quoted crate names of a Cargo dependencies list"
regexTarget = "match"
regexes = ['''\A[a-z0-9_-]+",\n "[a-z0-9_-]+( [0-9][0-9a-z.+-]*)?"\z''']
