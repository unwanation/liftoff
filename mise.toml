# Developer tooling, pinned. `mise install` (or `just setup`) installs it all;
# CI uses jdx/mise-action with this same file, so local == CI.
# Rust itself comes from rust-toolchain.toml via rustup.

[tools]
# Binary installer so the `cargo:` tools below download instead of compiling.
cargo-binstall = "1.25.1"

# Cargo plugins
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-nextest" = "0.9.146"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-llvm-cov" = "0.9.1"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-auditable" = "0.7.7"

# Formatters / linters / hooks
lefthook = "2.1.16"
just = "1.58.0"
taplo = "0.10.0"
typos = "1.50.3"
committed = "1.1.11"
actionlint = "1.7.12"
zizmor = "1.30.1"
gitleaks = "8.30.1"
hadolint = "2.15.1"
shellcheck = "0.11.0"

# Contract functions in TS and Python (`just functions`, plan phase 4,
# task 2.6): componentize-js runs under bun, componentize-py under uv.
bun = "1.4.2"
uv = "0.12.17"

# Module releases (modules/registry/release.sh, modules.yml)
minisign = "0.12"
jq = "1.8.1"

[settings]
# Fail if a tool in this file is missing instead of silently using a global.
not_found_auto_install = false
